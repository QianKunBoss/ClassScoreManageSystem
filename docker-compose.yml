version: '3.8'

services:
  classfire:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: classfire-app
    restart: unless-stopped
    ports:
      - "3000:3000"      # IPv4
      - "[::]:3000:3000"  # IPv6
    volumes:
      # SQLite 数据持久化（关键！）
      - classfire-data:/app/data
      # 日志持久化
      - classfire-logs:/app/logs
    environment:
      - NODE_ENV=production
      - SESSION_SECRET=${SESSION_SECRET:-change-this-to-a-random-secret}
      - HOST=::
      - PORT=3000
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/settings"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Nginx 反向代理（可选，推荐用于生产环境）
  nginx:
    image: nginx:alpine
    container_name: classfire-nginx
    restart: unless-stopped
    ports:
      - "80:80"           # IPv4
      - "[::]:80:80"      # IPv6
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/nginx/conf.d:/etc/nginx/conf.d:ro
      # HTTPS 证书目录（如果需要）
      # - ./deploy/nginx/certs:/etc/nginx/certs:ro
    depends_on:
      classfire:
        condition: service_healthy
    networks:
      - classfire-network

volumes:
  classfire-data:
    driver: local
  classfire-logs:
    driver: local

networks:
  classfire-network:
    driver: bridge
    enable_ipv6: true
    ipam:
      config:
        # 注意：subnet 必须是合法十六进制 IPv6 网段（旧值 fd00:csms::/64 含非十六进制字符，
        # Docker 解析会直接失败）
        - subnet: "fd00:ca1f::/64"
